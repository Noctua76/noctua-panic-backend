name: Backend Tests

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aegis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aegis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
      CHROMIUM_PATH: /usr/bin/google-chrome
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aegis_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install transport test prerequisites
        run: sudo apt-get update && sudo apt-get install -y openssh-server

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

  runtime-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image without build secrets
        run: docker build --tag aegis-questionnaire-review .
      - name: Verify runtime key provider and actual Chromium PDF
        run: |
          docker run --rm --network none --interactive aegis-questionnaire-review node <<'NODE'
          const assert=require('node:assert/strict');
          const c=require('node:crypto');
          const {Keyring}=require('./questionnaire/crypto');
          (async()=>{
            assert.equal(process.env.QUESTIONNAIRE_KEYRING_BASE64,undefined);
            assert.equal(process.env.DATABASE_URL,undefined);
            const pair=c.generateKeyPairSync('rsa',{modulusLength:3072});
            const entry={id:'synthetic-ci',publicKey:pair.publicKey.export({type:'spki',format:'pem'}),privateKey:pair.privateKey.export({type:'pkcs8',format:'pem'}),integrityKey:c.randomBytes(32).toString('base64')};
            const env={QUESTIONNAIRE_KEYRING_BASE64:Buffer.from(JSON.stringify({active:entry.id,entries:[entry]})).toString('base64')};
            const keys=Keyring.fromEnvironment(env);assert.equal(env.QUESTIONNAIRE_KEYRING_BASE64,undefined);
            assert.deepEqual(keys.open('synthetic','ci',{},keys.seal('synthetic','ci',{},{value:'test'})),{value:'test'});
            const browser=await require('puppeteer').launch({headless:true,executablePath:process.env.PUPPETEER_EXECUTABLE_PATH,args:['--no-sandbox','--disable-dev-shm-usage']});
            try{const page=await browser.newPage();await page.setContent('<html><body>AEGIS synthetic PDF αβγ</body></html>');const pdf=Buffer.from(await page.pdf());assert.equal(pdf.subarray(0,5).toString(),'%PDF-');assert.ok(pdf.length>1000);}finally{await browser.close();}
            console.log('RUNTIME_IMAGE_KEY_CUSTODY_AND_NATIVE_PDF_PASS');
          })().catch(()=>{console.error('RUNTIME_IMAGE_VERIFICATION_FAILED');process.exitCode=1;});
          NODE
